spring.application.name=chronos

spring.datasource.url=jdbc:postgresql://localhost:5432/tempos_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.swagger-ui.path=/api/docs

chronos.scheduler.poll-interval-ms=5000
chronos.scheduler.batch-size=10
chronos.scheduler.recovery-interval-ms=60000
chronos.scheduler.stuck-task-timeout=2m
chronos.retry.max-retries=3
chronos.retry.backoff-base-seconds=30
chronos.retry.backoff-multiplier=2
